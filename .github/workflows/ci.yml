name: CI

on:
  push:
    branches: [ main ]

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      TAG: ${{ steps.tag.outputs.release_tag }}
    steps:
      - name: Generate Release Tag
        id: tag
        run: |
          TAG=release-$(date +'%Y%m%d-%H%M%S')
          echo "::set-output name=release_tag::$TAG"

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      API_KEY: ${{ secrets.API_KEY }}
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}
      RELEASE_TAG: ${{ needs.prepare.outputs.TAG }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Install dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf

      # (Aucun webkit2gtk sur macOS; rien à installer ici pour mac)
      # (Pour Windows, ajouter d'autres dépendances si nécessaire)

      - name: Install project dependencies
        run: npm install

      - name: Build Tauri App
        run: npm run tauri build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-${{ matrix.os }}-${{ env.RELEASE_TAG }}
          path: src-tauri/target/release/bundle

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-ubuntu-latest-${{ needs.prepare.outputs.TAG }}
          path: build/linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-windows-latest-${{ needs.prepare.outputs.TAG }}
          path: build/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-macos-latest-${{ needs.prepare.outputs.TAG }}
          path: build/macos

      - name: Archive Linux artifacts
        run: zip -r linux-artifacts.zip build/linux

      - name: Archive Windows artifacts
        run: zip -r windows-artifacts.zip build/windows

      - name: Archive macOS artifacts
        run: zip -r macos-artifacts.zip build/macos

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare.outputs.TAG }}
          release_name: Release ${{ needs.prepare.outputs.TAG }}
          draft: false
          prerelease: false

      - name: Upload Linux Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: linux-artifacts.zip
          asset_name: linux-artifacts.zip
          asset_content_type: application/zip

      - name: Upload Windows Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: windows-artifacts.zip
          asset_name: windows-artifacts.zip
          asset_content_type: application/zip

      - name: Upload macOS Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: macos-artifacts.zip
          asset_name: macos-artifacts.zip
          asset_content_type: application/zip
